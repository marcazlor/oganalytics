services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Dentro de la red de Compose, el host de la base de datos es el
      # nombre del servicio ("postgres"), no localhost.
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      # Sin este volumen los datos se perderían al recrear el contenedor.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # depends_on solo espera a que el contenedor arranque, no a que
      # Postgres acepte conexiones. Este healthcheck sí lo garantiza.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: